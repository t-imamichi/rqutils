[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rqutils"
version = "0.2.0"
authors = [
  { name="Yutaro Iiyama", email="iiyama@icepp.s.u-tokyo.ac.jp" },
]
description = "Random quantum utilities"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "jax[cuda12]; sys_platform == 'linux'",
    "jax; sys_platform == 'darwin'",
    # Qiskit is a public *input* type, not just a convenience: `PauliSumXZ.from_paulisum` accepts a
    # SparsePauliOp, and `svsim` accepts a QuantumCircuit. The HAS_QISKIT guards stay -- they are what
    # keeps a broken qiskit install a RuntimeError at the call site rather than an ImportError at
    # `import rqutils`.
    "qiskit",
]

[project.optional-dependencies]
mpl = ["matplotlib"]
qutip = ["qutip"]
# `qiskit` moved to the required dependencies above, but `uv run --extra qiskit ...` appears throughout
# CLAUDE.md, NOTES.md, docs/ and every examples/scaling/ docstring; deleting the name would make all of
# those fail with "unknown extra" for no benefit, so it stays as an empty alias that installs nothing.
qiskit = []
# mpi4py stays an extra deliberately: it needs a working host MPI to build, so requiring it would make
# every install depend on the system MPI -- and nothing under rqutils/ imports it. Only the
# multi-process example paths need it (`examples/sqd.py --gpus mpi`, `examples/scaling/*.py
# --devices mpi`).
mpi = ["mpi4py"]
docs = ["sphinx", "sphinx-rtd-theme"]
dev = ["pytest", "pytest-xdist", "pytest-sugar", "ruff", "ty"]

[project.urls]
Homepage = "https://github.com/UTokyo-ICEPP/rqutils"
Issues = "https://github.com/UTokyo-ICEPP/rqutils/issues"
Documentation = "https://rqutils.readthedocs.io/en/latest/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Not `auto`, which oversubscribes and is slower. `-n0` to override.
#
# Slow == spawns a subprocess (~25 s of a ~30 s serial suite), so that property is the fast/slow split.
# `pytest -m ""` runs everything and is REQUIRED before committing; there is no CI, so this default is
# the only thing that runs. `conftest.pytest_terminal_summary` warns when a group is deselected.
addopts = "-n 4 -m 'not subprocess'"
# Applied by `conftest.pytest_collection_modifyitems` from the helper each test calls, so a marker
# cannot drift. `subprocess` is the speed axis; the rest name coverage, so `-m sharded` skips the rest.
markers = [
  "subprocess: spawns a subprocess (the slow group); deselected by default",
  "sharded: spawns a virtual-multi-device child; the only coverage of sharding defects",
  "typecheck: re-runs `ty` with a rule forced to error",
  "optdeps: re-imports a module with an optional dependency blocked",
]

[tool.ruff]
line-length = 100
# The notebooks under tests/ are interactive scratchpads that get their names from IPython magics
# (`%aimport rqutils.paulis`), which ruff cannot see -- so every use reads as F821 undefined-name.
exclude = [".venv", "*.ipynb"]

[tool.ty.src]
exclude = ["**/*.ipynb"]

[tool.ty.rules]
# JAX ships almost no type information, and `jax.jit` converts arguments before the body runs, so a
# parameter annotated `int` really does have a `.dtype` when read. numpy's stubs are also stricter than
# the dtype-generic `npmod` convention allows. Tool limitation, not defect -- revisit when JAX ships
# stubs. Six sibling rules were retired by fixing their sites; `docs/typing-notes.md` has the survey,
# the per-rule counts, and which remaining findings are worth acting on.
unresolved-attribute = "ignore"
no-matching-overload = "ignore"
invalid-argument-type = "ignore"
invalid-return-type = "ignore"

