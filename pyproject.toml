[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rqutils"
version = "0.2.0"
authors = [
  { name="Yutaro Iiyama", email="iiyama@icepp.s.u-tokyo.ac.jp" },
]
description = "Random quantum utilities"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "jax[cuda12]; sys_platform == 'linux'",
    "jax; sys_platform == 'darwin'",
]

[project.optional-dependencies]
mpl = ["matplotlib"]
qutip = ["qutip"]
qiskit = ["qiskit[visualization]"]
docs = ["sphinx", "sphinx-rtd-theme"]
dev = ["pytest", "pytest-xdist", "pytest-sugar", "ruff", "ty"]

[project.urls]
Homepage = "https://github.com/UTokyo-ICEPP/rqutils"
Issues = "https://github.com/UTokyo-ICEPP/rqutils/issues"
Documentation = "https://rqutils.readthedocs.io/en/latest/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
# The notebooks under tests/ are interactive scratchpads that get their names from IPython magics
# (`%aimport rqutils.paulis`), which ruff cannot see -- so every use reads as F821 undefined-name.
exclude = [".venv", "*.ipynb"]

[tool.ty.src]
exclude = ["**/*.ipynb"]

[tool.ty.rules]
# JAX ships almost no type information and `jax.jit` converts arguments before a function body runs,
# so ty cannot see that a Python int reaching an `x.dtype` is an Array by then. numpy's stubs are
# stricter than this library's dtype-generic `npmod` convention allows: every `ArrayLike.shape` and
# every `einsum`/`prod` overload reads as an error. These were reviewed individually -- the
# structural findings they hid (a None subscript, a missing tuple element, a Number-ABC default)
# are fixed in the code; what remains is tool limitation, not defect. Revisit when JAX ships stubs.
#
# Keep this list as short as the code allows: `unresolved-import`, `unsupported-operator` and
# `not-iterable` were all retired by fixing their few real sites, and two of the three had a genuine
# defect hiding behind them (a `None` angle reaching arithmetic in `conftest.gate_unitary`, and
# `QPrintBase._process` annotated `list[list[Term]]` while returning `list[Term]`). Before adding a
# rule here, count the diagnostics -- `ty check -c 'rules.X="error"'` -- and read them.
# `invalid-return-type` is the next candidate: 7 sites, of which `math.py`'s two are the same
# `with_diagonals` union that the @overload pattern fixes. That pattern has now retired
# `invalid-assignment` too -- overloading `ground_locg` on `debug: Literal[...]` took 19 diagnostics to
# 1, and the last was a test asserting a read-only property raises (per-line ignore there).
unresolved-attribute = "ignore"
no-matching-overload = "ignore"
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
not-subscriptable = "ignore"

